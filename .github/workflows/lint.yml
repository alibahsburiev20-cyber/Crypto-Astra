name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --check client/app.js
      # site.ts генерируется из client/. Если он отстал, деплой отдаст старый клиент.
      - run: node scripts/embed-client.mjs
      - run: git diff --exit-code -- worker/src/static/site.ts
