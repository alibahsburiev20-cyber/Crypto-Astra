name: Validate Crypto Astra
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js && node --check auth.js && node --check supabase/config.js
      - name: Validate markup references and game art
        run: node scripts/validate.mjs
