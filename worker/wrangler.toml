## СГЕНЕРИРОВАНО из ../wrangler.toml скриптом scripts/sync-wrangler.mjs.
## Не редактируйте вручную: измените корневой конфиг и запустите npm run config:sync.
## Нужен для сборки Cloudflare, настроенной на --config worker/wrangler.toml.
name = "crypto-astra"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Публичный site key Turnstile (можно хранить в репозитории). Секрет — только через
# `wrangler secret put TURNSTILE_SECRET`. Пустые значения означают «проверка выключена»:
# так работают локальная разработка и тесты.
[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAAGGq5Lt25F34cDiq"
# Метка сборки видна в /health: по ней понятно, что задеплоено.
APP_BUILD = "2026-11-17.2"
# Astra Pay. Включённым считается ТОЛЬКО значение "on": опечатка, пустая строка
# или "true" означают «выключено». Дочерние флаги не работают без
# PAYMENTS_ENABLED.
#
# Включено владельцем 17 ноября 2026: приём USDT и покупки. Выплаты, пул и
# консолидация по-прежнему выключены — это отдельное решение.
#
# Важно: флаг открывает маршруты, но кошелёк игроку выдаёт Signer. Пока Signer не
# задеплоен с секретом, `/pay/status.json` отвечает `wallets: "signer_required"`,
# а витрина пишет «Нужен кошелёк» вместо кнопки покупки. Шаги — docs/PAY-SIGNER.md.
PAYMENTS_ENABLED = "on"
DEPOSITS_ENABLED = "on"
PURCHASES_ENABLED = "on"
POOL_ENABLED = "off"
# Доля выручки магазина, которая начисляется в призовой фонд сезона. Это наши
# деньги, а не взносы игроков: вкладов и «доходных» механик в игре нет.
POOL_PRIZE_SHARE = "40"
PAYOUTS_ENABLED = "off"
SWEEP_ENABLED = "off"
# mainnet — настоящий USDT TRC-20. Тестнет остаётся для превью-сборок.
PAY_NETWORK = "mainnet"
# Какая сеть принимает деньги: "tron" (TRC-20) или "bsc" (BEP-20, USDT на BNB Chain).
# BSC дешевле (~0.01 USDT за перевод против ~2 USDT на TRON), но рельс ещё дописывается:
# пока готовы не все шаги, воркер сам откажется и выдавать адреса, и сканировать —
# смотрите `rail` в /pay/status.json. Пустое или неизвестное значение = деньги стоят.
PAY_CHAIN = "tron"
# Свой JSON-RPC для BSC. Пусто — публичный эндпоинт из worker/src/pay/evm/config.ts.
PAY_EVM_RPC = ""
# USDT-контракт в TRON. Пусто = TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t (mainnet).
PAY_USDT_CONTRACT = ""
# USDT-контракт в BSC — отдельная переменная, потому что формат адреса другой.
# Пусто = Binance-Peg BSC-USD 0x55d398326f99059fF775485246999027B3197955.
# В BSC-тестнете контракта по умолчанию нет: задавайте свой явно, иначе приём выключен.
PAY_EVM_CONTRACT = ""
# Потолок ставки газа на выплату, wei. Пусто = 20 gwei. Выше — отказ, а не «дорого, но ладно».
PAY_MAX_GAS_PRICE_WEI = ""

# Клиент отдаётся тем же Worker (бесплатно). Один адрес для сайта и API: не нужны CORS, кука refresh работает.
# Запросы, для которых нет файла в client/ (/auth/*, /me, /claim), идут в Worker.
[assets]
directory = "../client"

[[d1_databases]]
binding = "DB"
database_name = "astra-global"
database_id = "49cf3fff-baaa-4c06-b750-9946778e7380"
# База для превью-сборок: отдельная, чтобы тестовые аккаунты и миграции не
# задевали живой мир. Нужна ещё и для `d1 migrations apply DB --remote --preview`:
# без этого поля wrangler ищет базу только среди основных.
preview_database_id = "a9656807-8f65-4f3d-bf77-1ac7fd49e6a3"
migrations_dir = "migrations/d1"

[[durable_objects.bindings]]
name = "WORLD"
class_name = "World"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "WorldLobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["World", "WorldLobby"]

[triggers]
crons = ["0 * * * *", "0 3 * * *"]

# Workers Builds Previews: отдельная D1-база и изолированные Durable Objects.
[previews]

[[previews.d1_databases]]
binding = "DB"
database_name = "astra-preview"
database_id = "a9656807-8f65-4f3d-bf77-1ac7fd49e6a3"

[[previews.durable_objects.bindings]]
name = "WORLD"
class_name = "World"

[[previews.durable_objects.bindings]]
name = "LOBBY"
class_name = "WorldLobby"

[previews.vars]
TURNSTILE_SITE_KEY = ""
ADS_ENABLED = "false"
# Превью — песочница: деньги выключены всегда, даже если в бою когда-нибудь
# включат. Отдельная D1 (astra-preview) и отдельный контур.
PAYMENTS_ENABLED = "off"
DEPOSITS_ENABLED = "off"
PURCHASES_ENABLED = "off"
POOL_ENABLED = "off"
PAYOUTS_ENABLED = "off"
SWEEP_ENABLED = "off"
PAY_NETWORK = "nile"
# Превью живёт на TRON-тестнете: BSC-тестнет требует собственного USDT-контракта,
# а «угаданный» адрес означал бы приём чужого токена за деньги.
PAY_CHAIN = "tron"
# Ключ подписи токенов для превью. Это НЕ секрет и он лежит в репозитории:
# так превью-сборка работает сразу после деплоя, без доступа к терминалу и без
# ручного `wrangler secret put`. Токены превью поэтому теоретически может
# подписать кто угодно — это допустимо только потому, что у превью своя D1
# (`astra-preview`) и свои Durable Objects, реальных аккаунтов там нет.
# НА ПРОДЕ значение обязано быть секретом (`wrangler secret put JWT_SECRET`) и
# отличаться от этого: worker/test/unit/config.test.ts следит, чтобы ключ не
# попал в боевые `[vars]`.
JWT_SECRET = "preview-only-not-a-secret-3f9b1c27a4e85d60"

# R2 (архив и бэкапы) включается позже, когда появится доход. Без блока снимки
# сезонов и недельные снимки мира складываются в D1 `world_snapshots.payload`:
# код читает биндинг как необязательный, при подключении бакета менять код не нужно.
# [[r2_buckets]]
# binding = "ARCHIVE"
# bucket_name = "astra-archive"

# Связка с Signer-воркером: ключи живут там, основной Worker видит только
# `env.SIGNER.fetch(...)`. Пока сервис не задеплоен, блок должен быть закомментирован:
# деплой со ссылкой на несуществующий сервис падает целиком.
[[services]]
binding = "SIGNER"
service = "astra-pay-signer"
