# Astra Pay Signer — отдельный Worker. НЕ публикуется в интернет:
# `workers_dev = false`, доступ только через service binding из основного Worker.
#
# Секреты задаются в дашборде Cloudflare → Workers → astra-pay-signer → Settings →
# Variables → Encrypt (или `wrangler secret put`, если есть терминал):
#   SIGNER_TOKEN        — случайная строка ≥ 32 символов, та же, что у основного Worker
#   SIGNER_SEED         — hex-семя для адресов игроков (≥ 32 байта), генерируется один раз
#   SIGNER_PRIVATE_KEY  — hex приватного ключа горячего кошелька (только для выплат)
#                         Для BSC это тот же ключ, что и для TRON: адрес 0x…
#                         вычисляется из него же (keccak от открытого ключа).
#
# Ключи НЕ хранятся в репозитории, в D1, в браузере и в [vars].

name = "astra-pay-signer"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Никакого публичного адреса: попасть можно только из основного Worker.
workers_dev = false

[vars]
# Лимит на одну транзакцию: 100 USDT. Меняется осознанно, вместе с лимитами выплат.
# Единица — микро-USDT (1e-6), одна и та же для TRON и BSC: 18 знаков сети сюда не
# попадают, перевод внутри Signer считается через `pay/units.ts`.
SIGNER_MAX_TX_MICRO = "100000000"

# --- BNB Chain (BEP-20) ---
# Контракт USDT. Signer подписывает перевод ТОЛЬКО этим контрактом: «to» из
# запроса не принимается, иначе подпись можно выманить на произвольный вызов
# (например, approve на весь кошелёк). Пусто = выплата в EVM выключена.
SIGNER_EVM_CONTRACT = ""
# Какие сети подписываем: 56 — BSC mainnet, 97 — тестнет. Список через запятую.
# Держим явно: подпись с чужим chainId в другую сеть = деньги в чужой цепи.
SIGNER_EVM_CHAIN_IDS = "56"
