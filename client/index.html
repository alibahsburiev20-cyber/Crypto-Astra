<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Crypto Astra</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <h1>Crypto Astra</h1>
    <p class="tagline">Космическая экономическая игра</p>

    <section id="auth" hidden>
      <div class="tabs">
        <button type="button" id="tab-register" class="tab active">Регистрация</button>
        <button type="button" id="tab-login" class="tab">Вход</button>
      </div>
      <form id="auth-form" autocomplete="on">
        <label>Email <input id="email" type="email" required autocomplete="email"></label>
        <label>Пароль (8–128 символов) <input id="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password"></label>
        <div id="turnstile" class="turnstile" hidden></div>
        <button type="submit" id="auth-submit">Зарегистрироваться</button>
        <p id="auth-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="game" hidden>
      <div class="row">
        <span id="world" class="muted"></span>
        <button type="button" id="logout" class="link">Выйти</button>
      </div>
      <p id="frozen" class="error" hidden>Мир заморожен: сверка журнала не сошлась. Игровые действия остановлены.</p>
      <div id="panel"></div>
      <nav class="dock" aria-label="Разделы">
        <button type="button" data-view="bridge" class="active">Мостик</button>
        <button type="button" data-view="flight">Рейс</button>
        <button type="button" data-view="fleet">Флот</button>
        <button type="button" data-view="wallet">Кошелёк</button>
        <button type="button" data-view="ledger">Журнал</button>
      </nav>
    </section>
  </main>
  <footer>
    ASTRA Coins — внутриигровая валюта. Это не деньги, не токен и не актив; выплат нет, прибыли не обещаем.
  </footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
